name: Update vendored skills

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Move vendor submodules to upstream tips
        id: sync
        run: |
          git submodule update --init --remote plugins/sccgo/vendor
          if git diff --quiet HEAD -- plugins/sccgo/vendor; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch-bump sccgo version
        if: steps.sync.outputs.changed == 'true'
        id: bump
        run: |
          V=$(jq -r '.version' plugins/sccgo/.claude-plugin/plugin.json)
          NV=$(jq -nr --arg v "$V" '$v | split(".") | .[2] |= (tonumber + 1 | tostring) | join(".")')
          jq --indent 2 --arg nv "$NV" '.version = $nv' plugins/sccgo/.claude-plugin/plugin.json > /tmp/plugin.json
          jq --indent 2 --arg nv "$NV" '(.plugins[] | select(.name == "sccgo") | .version) = $nv' .claude-plugin/marketplace.json > /tmp/marketplace.json
          mv /tmp/plugin.json plugins/sccgo/.claude-plugin/plugin.json
          mv /tmp/marketplace.json .claude-plugin/marketplace.json
          echo "version=$NV" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/sccgo/vendor plugins/sccgo/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "sccgo: update vendored skills (v${{ steps.bump.outputs.version }})"
          git push origin main
